spring.application.name=algoventure-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/algoventure}
spring.datasource.username=${DB_USER:algoventure}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.instructor-password=${SEED_INSTRUCTOR_PASSWORD:}
